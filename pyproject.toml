[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-quant"
version = "0.1.0"
description = "Execution-aware quantitative research for Polymarket weather markets"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Abdullah Sezdi", email = "abdullahsezdi@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
